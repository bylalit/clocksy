{% extends "layout.html" %}
{% load static %}

{% block content %}
<style>
    .auth-section {
        background-color: #f8fafc;
    }
    
    .auth-card {
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        background-color: #ffffff;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    .form-control-custom {
        background-color: #f1f5f9;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 0.75rem 1rem;
        font-size: 0.9rem;
        transition: all 0.2s ease;
    }
    .form-control-custom:focus {
        background-color: #ffffff;
        border-color: #d97706;
        box-shadow: 0 0 0 4px rgba(217, 119, 6, 0.1);
    }

    .btn-gold-submit {
        background-color: #d97706;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        padding: 0.75rem 1.75rem;
        font-weight: 700;
        transition: all 0.2s ease;
    }
    .btn-gold-submit:hover {
        background-color: #b45309;
        color: #ffffff;
    }
</style>

<section class="auth-section py-5 min-vh-100 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                
                <!-- Card Container -->
                <div class="auth-card p-4 p-sm-5">
                    
                    <!-- Form Title -->
                    <div class="text-center mb-4">
                        <h3 class="fw-bold mb-1" style="color: #0f172a;">Welcome Back</h3>
                        <p class="text-muted small">Log in to manage your orders & wishlist</p>
                    </div>

                    <!-- Django Messages Alert -->
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger alert-dismissible fade show small rounded-3 mb-4" role="alert">
                                <i class="fa-solid fa-circle-exclamation me-2"></i>{{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <!-- Form -->
                    <form action="" method="post" class="login-form">
                        {% csrf_token %}

                        <!-- Username Input -->
                        <div class="mb-3">
                            <label for="username" class="form-label small fw-semibold text-dark">Username</label>
                            <input type="text" name="username" class="form-control form-control-custom" id="username" placeholder="Enter your username" required>
                        </div>

                        <!-- Password Input -->
                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label for="password" class="form-label small fw-semibold text-dark mb-1">Password</label>
                                <a href="#" class="small text-decoration-none text-danger fw-semibold">Forgot Password?</a>
                            </div>
                            <input type="password" name="password" class="form-control form-control-custom" id="password" placeholder="Enter your password" required>
                        </div>

                        <!-- Login Submit Button -->
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-gold-submit text-uppercase">
                                Log In <i class="fa-solid fa-arrow-right ms-2"></i>
                            </button>
                        </div>
                    </form>

                    <!-- Divider -->
                    <hr class="my-4 text-muted opacity-25">

                    <!-- Register Redirect CTA -->
                    <div class="text-center">
                        <span class="text-muted small me-2">Don't have an account?</span>
                        <a href="{% url 'register' %}" class="fw-bold text-dark text-decoration-none">
                            Create Account <i class="fa-solid fa-user-plus ms-1"></i>
                        </a>
                    </div>

                </div>

            </div>
        </div>
    </div>
</section>
{% endblock %}
