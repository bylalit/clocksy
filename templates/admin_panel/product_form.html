{% extends 'admin_panel/admin_layout.html' %}

{% block admin_content %}
<div class="row justify-content-center mb-5">
    <div class="col-lg-9 col-xl-8">
        <div class="card border-0 shadow-sm rounded-4 p-4 p-sm-5">
            <h4 class="fw-bold mb-4" style="color: #0f172a;">{{ title }}</h4>
            
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                <!-- Product Name -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-dark">Product Title / Name</label>
                    <input type="text" class="form-control" name="name" value="{{ product.name|default:'' }}" placeholder="e.g. Titan Karishma Analog Watch" required>
                </div>

                <div class="row g-3 mb-3">
                    <!-- Category Selection -->
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-dark">Category</label>
                        <select name="category" class="form-select" required>
                            <option value="">Select Category</option>
                            {% for cat in categories %}
                                <option value="{{ cat.id }}" {% if product and product.category.id == cat.id %}selected{% endif %}>
                                    {{ cat.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Brand Selection -->
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-dark">Brand</label>
                        <select name="brand" class="form-select" required>
                            <option value="">Select Brand</option>
                            {% for b in brands %}
                                <option value="{{ b.id }}" {% if product and product.brand.id == b.id %}selected{% endif %}>
                                    {{ b.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <!-- Price -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-dark">Price (₹)</label>
                    <input type="number" step="0.01" class="form-control" name="price" value="{{ product.price|default:'' }}" placeholder="e.g. 4999" required>
                </div>

                <!-- Description -->
                <div class="mb-4">
                    <label class="form-label small fw-semibold text-dark">Description</label>
                    <textarea class="form-control" name="description" rows="4" placeholder="Enter product specifications and details..." required>{{ product.description|default:'' }}</textarea>
                </div>

                <h6 class="fw-bold text-uppercase text-secondary mb-3" style="font-size: 0.8rem; letter-spacing: 0.5px;">Product Images</h6>

                <div class="row g-3 mb-4">
                    <!-- Image 1 -->
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold text-dark">Primary Image 1</label>
                        <input type="file" class="form-control form-control-sm" name="image1" {% if not product %}required{% endif %}>
                        {% if product.image1 %}
                            <div class="mt-2 text-center border rounded p-1 bg-light">
                                <img src="{{ product.image1.url }}" class="img-fluid rounded" style="max-height: 80px;" alt="">
                            </div>
                        {% endif %}
                    </div>

                    <!-- Image 2 -->
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold text-dark">Image 2 (Optional)</label>
                        <input type="file" class="form-control form-control-sm" name="image2">
                        {% if product.image2 %}
                            <div class="mt-2 text-center border rounded p-1 bg-light">
                                <img src="{{ product.image2.url }}" class="img-fluid rounded" style="max-height: 80px;" alt="">
                            </div>
                        {% endif %}
                    </div>

                    <!-- Image 3 -->
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold text-dark">Image 3 (Optional)</label>
                        <input type="file" class="form-control form-control-sm" name="image3">
                        {% if product.image3 %}
                            <div class="mt-2 text-center border rounded p-1 bg-light">
                                <img src="{{ product.image3.url }}" class="img-fluid rounded" style="max-height: 80px;" alt="">
                            </div>
                        {% endif %}
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex gap-2 pt-2 border-top">
                    <button type="submit" class="btn btn-warning fw-bold px-4">Save Product</button>
                    <a href="{% url 'admin_product_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
