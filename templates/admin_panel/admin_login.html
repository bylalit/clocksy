<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clocksy Admin | Console Login</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .admin-login-card {
            background-color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .login-header-box {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 2.5rem 2rem 2rem;
            text-align: center;
            border-bottom: 3px solid #d97706;
        }

        .form-control-admin {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            font-size: 0.9rem;
            transition: all 0.25s ease;
        }

        .form-control-admin:focus {
            background-color: #ffffff;
            border-color: #d97706;
            box-shadow: 0 0 0 4px rgba(217, 119, 6, 0.15);
        }

        .input-icon-wrapper {
            position: relative;
        }

        .input-icon-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .btn-admin-submit {
            background-color: #d97706;
            color: #ffffff;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            padding: 0.8rem;
            letter-spacing: 0.5px;
            transition: all 0.25s ease;
        }

        .btn-admin-submit:hover {
            background-color: #b45309;
            color: #ffffff;
            box-shadow: 0 6px 16px rgba(217, 119, 6, 0.3);
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

                <!-- Admin Card -->
                <div class="admin-login-card">
                    
                    <!-- Header -->
                    <div class="login-header-box text-white">
                        <div class="d-inline-flex align-items-center justify-content-center bg-warning bg-opacity-10 text-warning rounded-circle mb-2" style="width: 54px; height: 50px;">
                            <i class="fa-solid fa-shield-halved fs-4"></i>
                        </div>
                        <h4 class="fw-bold mb-1">Control Console</h4>
                        <p class="text-slate-400 small mb-0">Authorized Staff Access Only</p>
                    </div>

                    <!-- Body Form -->
                    <div class="p-4 p-sm-5 bg-white">
                        
                        <!-- Messages Alert -->
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show small rounded-3 mb-4" role="alert">
                                    <i class="fa-solid fa-circle-exclamation me-1"></i> {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                </div>
                            {% endfor %}
                        {% endif %}

                        <form method="POST" action="">
                            {% csrf_token %}

                            <!-- Username Field -->
                            <div class="mb-3">
                                <label for="username" class="form-label small fw-semibold text-dark">Admin Username</label>
                                <div class="input-icon-wrapper">
                                    <i class="fa-solid fa-user"></i>
                                    <input type="text" name="username" class="form-control form-control-admin" id="username" placeholder="Enter admin username" required autofocus>
                                </div>
                            </div>

                            <!-- Password Field -->
                            <div class="mb-4">
                                <label for="password" class="form-label small fw-semibold text-dark">Password</label>
                                <div class="input-icon-wrapper">
                                    <i class="fa-solid fa-lock"></i>
                                    <input type="password" name="password" class="form-control form-control-admin" id="password" placeholder="Enter password" required>
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <button type="submit" class="btn btn-admin-submit w-100 text-uppercase">
                                Access Dashboard <i class="fa-solid fa-right-to-bracket ms-2"></i>
                            </button>
                        </form>

                        <div class="mt-4 pt-2 border-top text-center">
                            <a href="{% url 'index' %}" class="small text-muted text-decoration-none">
                                <i class="fa-solid fa-arrow-left me-1"></i> Return to Live Store
                            </a>
                        </div>

                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
