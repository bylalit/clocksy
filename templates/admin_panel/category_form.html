{% extends 'admin_panel/admin_layout.html' %}

{% block admin_content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm rounded-4 p-4">
            <h4 class="fw-bold mb-3" style="color: #0f172a;">{{ title }}</h4>
            
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-dark">Category Name</label>
                    <input type="text" class="form-control" name="name" value="{{ category.name|default:'' }}" placeholder="Enter category name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-dark">Category Image</label>
                    <input type="file" class="form-control" name="image" {% if not category %}required{% endif %}>
                    {% if category.image %}
                        <div class="mt-2">
                            <span class="small text-muted d-block mb-1">Current Image:</span>
                            <img src="{{ category.image.url }}" alt="" class="rounded border" style="height: 60px;">
                        </div>
                    {% endif %}
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-warning fw-bold px-4">Save Category</button>
                    <a href="{% url 'category_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
